<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>みありなタワーディフェンス</title>
  <style>
    :root {
      --bg: #fff2f6;
      --card: #fff;
      --line: #f7c7d7;
      --ink: #4b2a43;
      --accent: #ff6a9a;
      --accent2: #7b66ff;
      --muted: #8e7b8d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--ink);
      font-family: "Mochiy Pop One", "Hiragino Maru Gothic ProN", sans-serif;
      width: 100%; height: 100%; overflow: hidden;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at top left, #ffe0ef 0%, #fff2f6 28%, #fff2f6 100%);
    }
    #game {
      width: min(100vw, 420px); min-height: 100vh; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    #hud {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 3px solid var(--line); border-radius: 16px;
      padding: 6px 12px; font-size: 13px;
    }
    canvas {
      display: block; width: 100%; height: auto; border-radius: 16px;
      border: 3px solid var(--line); background: #d9f1bb; box-shadow: 0 6px 0 rgba(255,137,176,.25);
      image-rendering: auto;
    }
    .row {
      display: flex; gap: 6px;
    }
    .tool {
      flex: 1; background: var(--card); border: 3px solid var(--line); border-bottom-width: 5px;
      border-radius: 14px; color: var(--ink); font: inherit; font-size: 13px;
      padding: 8px 6px; cursor: pointer; min-height: 44px;
    }
    .tool.on {
      background: var(--accent); border-color: var(--accent); color: white;
    }
    .tool.go {
      background: var(--accent2); border-color: var(--accent2); color: white;
    }
    #panel {
      min-height: 46px; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.8); border: 2px dashed var(--line); border-radius: 14px;
      padding: 6px 10px; font-size: 12px; color: var(--muted); text-align: center;
    }
    .controls {
      display: flex; gap: 6px;
    }
    .controls button {
      flex: 1; background: var(--card); border: 3px solid var(--line); border-bottom-width: 5px;
      border-radius: 12px; font: inherit; font-size: 14px; padding: 8px 6px; cursor: pointer;
    }
    .controls .muted {
      background: #fff; color: var(--ink);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <span id="gold">💰 150</span>
      <span id="lives">❤️ 20</span>
      <span id="wave">フェーズ 0/10</span>
    </div>
    <canvas id="c" width="360" height="440"></canvas>
    <div id="tb" class="row"></div>
    <div id="panel">タワーを選んで、草の上をタップして設置！</div>
    <div class="controls">
      <button id="startBtn" class="go">▶</button>
      <button id="speedBtn">⏩×1</button>
      <button id="musicBtn" class="muted">🎵</button>
      <button id="sfxBtn" class="muted">🔊</button>
    </div>
  </div>

  <script>
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    const C = 40;
    const COLS = 9;
    const ROWS = 11;
    const tb = document.getElementById('tb');
    const panel = document.getElementById('panel');
    const goldEl = document.getElementById('gold');
    const livesEl = document.getElementById('lives');
    const waveEl = document.getElementById('wave');

    const towerTypes = {
      A: { name: '矢', color: '#ff71a8', cost: 50, range: 90, damage: 8, rate: 0.5 },
      B: { name: '砲', color: '#ff9e3d', cost: 100, range: 80, damage: 20, rate: 1.4 },
      C: { name: '氷', color: '#4cc9f0', cost: 70, range: 75, damage: 3, rate: 1.0 },
      D: { name: '雷', color: '#efc600', cost: 120, range: 85, damage: 14, rate: 1.2 },
      E: { name: '毒', color: '#7bcf4a', cost: 90, range: 80, damage: 2, rate: 0.9 },
      F: { name: '虹', color: '#ba8dff', cost: 150, range: 170, damage: 30, rate: 1.6 },
      Z: { name: '道', color: '#d8b086', cost: 0, range: 0, damage: 0, rate: 0 },
      K: { name: '壊', color: '#a6a7b7', cost: 0, range: 0, damage: 0, rate: 0 },
    };

    let state = {
      gold: 150,
      lives: 20,
      wave: 0,
      towers: [],
      enemies: [],
      bullets: [],
      fx: [],
      selectedTower: null,
      build: 'A',
      running: false,
      map: [[0, 5], [1, 5], [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [7, 5], [8, 5]],
      goal: [8, 5],
      start: [0, 5],
      speed: 1,
      miaDoubleTap: 0,
      miaGhost: false,
      allowHeroBuild: false,
      difficulty: 'ふつう',
      bgmEnabled: true,
      sfxEnabled: true,
      musicOsc: null,
      musicTimer: null
    };

    function setPanel(msg) {
      panel.textContent = msg;
    }

    function updateHud() {
      goldEl.textContent = '💰 ' + state.gold;
      livesEl.textContent = '❤️ ' + state.lives;
      waveEl.textContent = 'フェーズ ' + state.wave + '/10';
    }

    function addTower(x, y, type) {
      const t = { x, y, type, cd: 0, lv: 1, cost: towerTypes[type].cost };
      state.towers.push(t);
    }

    function addRoadCell(cx, cy) {
      const road = state.map;
      const key = cx + ',' + cy;
      if (!road.some(([rx, ry]) => rx === cx && ry === cy)) {
        road.push([cx, cy]);
      }
    }

    function addEnemy(kind) {
      const base = { x: state.start[0] * C + 20, y: state.start[1] * C + 20, hp: 12, maxHp: 12, speed: 18, type: kind, alt: 0, progress: 0, alive: true };
      const bossMap = {
        'ゴジラ': { hp: 70, speed: 14 },
        'プロボウラー': { hp: 46, speed: 17 },
        'モビルスーツ': { hp: 55, speed: 16 }
      };
      if (bossMap[kind]) Object.assign(base, bossMap[kind], { boss: true });
      if (!base.boss) {
        base.hp = 10 + state.wave * 2;
        base.maxHp = base.hp;
        base.speed = 28 + state.wave * 1.8;
      }
      state.enemies.push(base);
    }

    function addFx(x, y, txt, color = '#ff5b7d', radius = 0) {
      state.fx.push({ x, y, txt, color, radius, life: 1.2 });
    }

    function createDifficultyButtons() {
      const diff = [
        { name: '超かんたん', gold: 260, lives: 28, speed: 0.8 },
        { name: 'かんたん', gold: 180, lives: 22, speed: 1 },
        { name: 'ふつう', gold: 150, lives: 20, speed: 1.2 },
        { name: 'むずかしい', gold: 120, lives: 14, speed: 1.5 }
      ];
      const row = document.createElement('div');
      row.className = 'row';
      diff.forEach((d, index) => {
        const btn = document.createElement('button');
        btn.className = 'tool';
        btn.textContent = d.name;
        btn.onclick = () => {
          state.difficulty = d.name;
          state.gold = d.gold;
          state.lives = d.lives;
          Array.from(row.children).forEach((b) => b.classList.remove('on'));
          btn.classList.add('on');
          updateHud();
        };
        if (index === 2) btn.classList.add('on');
        row.appendChild(btn);
      });
      document.getElementById('game').insertBefore(row, document.getElementById('tb'));
    }

    function drawMap() {
      ctx.fillStyle = '#c9f0b8';
      ctx.fillRect(0, 0, cv.width, cv.height);

      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          if ((x + y) % 2 === 0) {
            ctx.fillStyle = '#bfe8b7';
            ctx.fillRect(x * C, y * C, C, C);
          }
        }
      }

      ctx.strokeStyle = '#f4c98b';
      ctx.lineWidth = C - 2;
      ctx.beginPath();
      state.map.forEach(([x, y], idx) => {
        const px = x * C + 20;
        const py = y * C + 20;
        if (idx === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      state.map.forEach(([x, y]) => {
        ctx.fillText('・', x * C + 20, y * C + 20);
      });

      const endX = state.goal[0] * C + 20;
      const endY = state.goal[1] * C + 20;
      ctx.fillStyle = '#ff6fa5';
      ctx.fillRect(endX - 12, endY - 12, 24, 24);

      const heroX = 60;
      const heroY = 380;
      ctx.save();
      ctx.globalAlpha = state.miaGhost ? 0.45 : 1;
      ctx.fillStyle = '#ff9ec4';
      ctx.beginPath();
      ctx.arc(heroX, heroY, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(heroX - 5, heroY - 3, 3, 0, Math.PI * 2);
      ctx.arc(heroX + 5, heroY - 3, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#4b2a43';
      ctx.beginPath();
      ctx.arc(heroX - 5, heroY - 3, 1.5, 0, Math.PI * 2);
      ctx.arc(heroX + 5, heroY - 3, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6a9a';
      ctx.fillText('未亜', heroX, heroY + 26);
      ctx.restore();
    }

    function drawTowers() {
      state.towers.forEach((t) => {
        const meta = towerTypes[t.type];
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = meta.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.name, t.x, t.y + 1);
      });
    }

    function drawEnemies() {
      state.enemies.forEach((e) => {
        if (!e.alive) return;
        const boss = e.boss ? 16 : 10;
        const color = e.boss ? '#9c7aff' : '#ff8aa6';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, boss, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4b2a43';
        ctx.fillRect(e.x - 15, e.y - boss - 8, 30, 4);
        ctx.fillStyle = '#39d98a';
        ctx.fillRect(e.x - 15, e.y - boss - 8, 30 * (e.hp / e.maxHp), 4);
      });
    }

    function drawBullets() {
      state.bullets.forEach((b) => {
        ctx.fillStyle = b.color || '#ffcb52';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawFx() {
      state.fx.forEach((f) => {
        ctx.globalAlpha = Math.max(0, f.life);
        if (f.txt) {
          ctx.fillStyle = f.color;
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(f.txt, f.x, f.y);
        } else {
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }

    function fireBullet(from, to, damage, color) {
      state.bullets.push({ x: from.x, y: from.y, dx: to.x - from.x, dy: to.y - from.y, damage, color, life: 1 });
    }

    function updateBullets() {
      const next = [];
      state.bullets.forEach((b) => {
        const dist = Math.hypot(b.dx, b.dy);
        if (dist < 2) return;
        const nx = b.dx / dist;
        const ny = b.dy / dist;
        b.x += nx * 8;
        b.y += ny * 8;
        b.dx -= nx * 8;
        b.dy -= ny * 8;
        b.life -= 0.02;
        if (b.life > 0) next.push(b);
      });
      state.bullets = next;
    }

    function updateEnemies() {
      const route = state.map;
      const routeIndex = route.length - 1;
      state.enemies.forEach((e) => {
        if (!e.alive) return;
        const goalX = state.goal[0] * C + 20;
        const goalY = state.goal[1] * C + 20;
        const dx = goalX - e.x;
        const dy = goalY - e.y;
        const len = Math.hypot(dx, dy);
        if (len < 2) {
          state.lives = Math.max(0, state.lives - (e.boss ? 3 : 1));
          e.alive = false;
          addFx(goalX, goalY, 'うわ〜！', '#ff5b7d');
          sfx('leak');
          if (state.lives <= 0) {
            setPanel('ゲームオーバー。もう一度挑もう！');
            state.running = false;
          }
          return;
        }
        e.x += (dx / len) * e.speed * state.speed;
        e.y += (dy / len) * e.speed * state.speed;
      });

      state.enemies = state.enemies.filter((e) => e.alive);
    }

    function updateTowers() {
      state.towers.forEach((t) => {
        t.cd -= 0.016 * state.speed;
        let target = null;
        let bestDist = Infinity;
        state.enemies.forEach((e) => {
          if (!e.alive) return;
          const dist = Math.hypot(e.x - t.x, e.y - t.y);
          if (dist <= 120 && dist < bestDist) {
            bestDist = dist;
            target = e;
          }
        });
        if (target && t.cd <= 0) {
          fireBullet(t, target, towerTypes[t.type].damage, towerTypes[t.type].color);
          t.cd = towerTypes[t.type].rate;
          sfx(t.type);
        }
      });
    }

    function resolveBullets() {
      const remaining = [];
      state.bullets.forEach((b) => {
        let didHit = false;
        state.enemies.forEach((e) => {
          if (!e.alive) return;
          if (Math.hypot(e.x - b.x, e.y - b.y) < 10) {
            didHit = true;
            e.hp -= b.damage;
            if (e.hp <= 0) {
              e.alive = false;
              state.gold += e.boss ? 50 : 8;
              addFx(e.x, e.y, '+', '#ffd761');
              sfx('kill');
            }
          }
        });
        if (!didHit) remaining.push(b);
      });
      state.bullets = remaining;
      state.enemies = state.enemies.filter((e) => e.alive);
    }

    function maybeSpawnWave() {
      if (!state.running || state.enemies.length > 0) return;
      if (state.wave >= 10) {
        setPanel('クリア！ さらに挑戦してね！');
        state.running = false;
        return;
      }
      state.wave += 1;
      const spawnCount = 5 + state.wave * 2;
      for (let i = 0; i < spawnCount; i++) {
        const types = ['通常', '通常', '通常', 'ゴジラ', 'プロボウラー', 'モビルスーツ'];
        const kind = types[(state.wave + i) % types.length];
        addEnemy(kind);
      }
      setPanel(state.wave + 'フェーズ開始！');
      sfx('wave');
      updateHud();
    }

    function draw() {
      drawMap();
      drawTowers();
      drawEnemies();
      drawBullets();
      drawFx();
      requestAnimationFrame(draw);
    }

    function clickOnCanvas(event) {
      const rect = cv.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (cv.width / rect.width);
      const y = (event.clientY - rect.top) * (cv.height / rect.height);
      const cx = Math.floor(x / C);
      const cy = Math.floor(y / C);

      const heroX = 60;
      const heroY = 380;
      const heroDist = Math.hypot(x - heroX, y - heroY);
      if (heroDist < 30) {
        const now = performance.now();
        if (now - state.miaDoubleTap < 300) {
          state.miaGhost = !state.miaGhost;
          state.allowHeroBuild = state.miaGhost;
          state.miaDoubleTap = 0;
          setPanel(state.miaGhost ? '未亜が半透明になった。ここにも置けるよ。' : '未亜は元の姿に戻った。');
          sfx('tap');
          return;
        }
        state.miaDoubleTap = now;
        return;
      }

      if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return;
      const occupied = state.towers.some((t) => Math.floor((t.x + 8) / C) === cx && Math.floor((t.y + 8) / C) === cy);
      if (state.allowHeroBuild && heroDist < 30) return;

      if (state.build === 'Z') {
        if (state.map.some(([mx, my]) => mx === cx && my === cy)) {
          addRoadCell(cx, cy);
          setPanel('道を通した。');
          return;
        }
        addRoadCell(cx, cy);
        return;
      }

      if (state.build === 'K') {
        state.map = state.map.filter(([mx, my]) => !(mx === cx && my === cy));
        setPanel('道を削った。');
        return;
      }

      if (occupied) return;
      const meta = towerTypes[state.build];
      if (state.gold < meta.cost) {
        addFx(x, y, 'お金が足りない', '#ff5b7d');
        return;
      }
      state.gold -= meta.cost;
      addTower(cx * C + 20, cy * C + 20, state.build);
      setPanel(meta.name + 'を設置した。');
      updateHud();
      sfx('place');
    }

    function addToolButton(type, label) {
      const btn = document.createElement('button');
      btn.className = 'tool';
      btn.textContent = label;
      btn.onclick = () => {
        state.build = type;
        Array.from(tb.children).forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
        setPanel(type === 'Z' ? '道を引くモード' : type === 'K' ? '道を削るモード' : 'タワーを設置するモード');
      };
      tb.appendChild(btn);
    }

    function buildButtons() {
      Object.entries(towerTypes).forEach(([k, v]) => {
        if (k === 'Z' || k === 'K') {
          addToolButton(k, v.name);
        } else {
          addToolButton(k, v.name);
        }
      });
      tb.firstChild.classList.add('on');
      state.build = tb.firstChild.textContent === '矢' ? 'A' : 'A';
    }

    function initButtons() {
      tb.innerHTML = '';
      Object.entries(towerTypes).forEach(([key, v]) => {
        const btn = document.createElement('button');
        btn.className = 'tool';
        btn.textContent = v.name;
        btn.onclick = () => {
          state.build = key;
          Array.from(tb.children).forEach((b) => b.classList.remove('on'));
          btn.classList.add('on');
          setPanel(v.name + 'を選んだ。');
        };
        tb.appendChild(btn);
      });
      tb.children[0].classList.add('on');
      state.build = 'A';
    }

    function updateLoop() {
      if (state.running) {
        updateTowers();
        updateBullets();
        resolveBullets();
        updateEnemies();
        maybeSpawnWave();
      }
      state.fx.forEach((f) => { f.life -= 0.016 * state.speed; });
      state.fx = state.fx.filter((f) => f.life > 0);
      updateHud();
      requestAnimationFrame(updateLoop);
    }

    function startBattle() {
      state.running = !state.running;
      if (state.running) {
        setPanel('戦闘開始！');
        sfx('wave');
      } else {
        setPanel('一時停止');
      }
    }

    function musicToggle() {
      state.bgmEnabled = !state.bgmEnabled;
      const btn = document.getElementById('musicBtn');
      btn.textContent = state.bgmEnabled ? '🎵' : '🔇';
      bgm(state.bgmEnabled);
    }

    function sfxToggle() {
      state.sfxEnabled = !state.sfxEnabled;
      const btn = document.getElementById('sfxBtn');
      btn.textContent = state.sfxEnabled ? '🔊' : '🔇';
    }

    function bgm(on) {
      if (!on) {
        if (state.musicOsc) {
          state.musicOsc.stop();
          state.musicOsc = null;
        }
        if (state.musicTimer) {
          clearInterval(state.musicTimer);
          state.musicTimer = null;
        }
        return;
      }
      if (state.musicOsc) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audio = new AudioCtx();
      const melody = [440, 523, 659, 523, 587, 523, 440, 392];
      let i = 0;
      const play = () => {
        if (!state.bgmEnabled || !audio) return;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'triangle';
        osc.frequency.value = melody[i % melody.length];
        gain.gain.value = 0.02;
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + 0.12);
        i += 1;
      };
      state.musicOsc = audio;
      state.musicTimer = setInterval(play, 220);
    }

    function sfx(name) {
      if (!state.sfxEnabled) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const actx = new AudioCtx();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      const map = {
        tap: [660, 'square', 0.06],
        place: [760, 'square', 0.08],
        wave: [392, 'triangle', 0.09],
        kill: [880, 'sawtooth', 0.06],
        leak: [220, 'sawtooth', 0.15],
        A: [1200, 'square', 0.05],
        B: [180, 'square', 0.12],
        C: [1500, 'triangle', 0.08],
        D: [900, 'sawtooth', 0.06],
        E: [400, 'sine', 0.1],
        F: [1800, 'triangle', 0.12],
        Z: [480, 'square', 0.04],
        K: [600, 'square', 0.03]
      };
      const line = map[name] || [440, 'square', 0.05];
      const [freq, type, dur] = line;
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = 0.03;
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + dur);
    }

    document.getElementById('startBtn').onclick = startBattle;
    document.getElementById('speedBtn').onclick = () => {
      state.speed = state.speed === 1 ? 2 : state.speed === 2 ? 3 : 1;
      document.getElementById('speedBtn').textContent = '⏩×' + state.speed;
    };
    document.getElementById('musicBtn').onclick = musicToggle;
    document.getElementById('sfxBtn').onclick = sfxToggle;

    cv.addEventListener('pointerdown', clickOnCanvas);

    initButtons();
    updateHud();
